services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./functions
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGODB_URI=mongodb://mongodb:27017
      - APP_ID=amber-ink
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - EMERGENCY_THRESHOLD_DAYS=${EMERGENCY_THRESHOLD_DAYS:-3}
      - PORT=8080
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    # Note: server.js handles all routing, mimicking Cloud Run behavior.

volumes:
  mongodb_data:
