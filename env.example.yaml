# Google Cloud Run Environment Variables (Template)
# Copy this to env.yaml and fill in your secrets.
# Use with: gcloud run deploy --env-vars-file env.yaml

GEMINI_API_KEY: "your-api-key-here"
GEMINI_MODEL: "gemini-2.5-flash"
APP_ID: "amber-ink"

# MongoDB Configuration
MONGODB_URI: "mongodb+srv://[USER]:[PASS]@[CLUSTER].mongodb.net/amber_ink?retryWrites=true&w=majority"
MONGODB_DB_NAME: "amber_ink"

# Delivery Service Configuration (SMTP)
SMTP_HOST: "smtp.gmail.com"
SMTP_PORT: "587"
SMTP_USER: "your-email@gmail.com"
SMTP_PASS: "your-app-password"
BASE_FUNCTION_URL: "https://your-backend-url.run.app"
FRONTEND_URL: "https://your-frontend-url.github.io/amber-ink"

# Security & Logic
ADMIN_TOKEN: "your-secret-token-here"
EMERGENCY_THRESHOLD_DAYS: "3"
